[project]
name = "nycm-pipelines"
version = "0.1.0"
description = "Offline data pipelines for the nycm router (OSM walking graph, GTFS timetables)."
requires-python = ">=3.11"
dependencies = [
  "osmium>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
# pipelines/flood_elevation.py (3DEP lidar -> building elevations + flood grid)
flood = [
  "rasterio>=1.3",
  "numpy>=1.26",
  "pillow>=10",
  "shapely>=2.0",
  "pmtiles>=3.2",
  "mapbox-vector-tile>=2.0",
  "scikit-image>=0.22",
  "numba>=0.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
