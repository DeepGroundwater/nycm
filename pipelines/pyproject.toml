[project]
name = "nycm-pipelines"
version = "0.1.0"
description = "Offline data pipelines for the nycm router (OSM walking graph, GTFS timetables)."
requires-python = ">=3.11"
dependencies = [
  "osmium>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
