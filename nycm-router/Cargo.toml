[package]
name = "nycm-router"
version = "0.1.0"
edition = "2021"
description = "Walking + transit router for the NYC metro map, compiled to WASM."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
bincode = "1.3"
thiserror = "1"
console_error_panic_hook = "0.1"

[dev-dependencies]
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
